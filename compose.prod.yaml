name: backend-nail-art-app-prod

# Start through scripts/release.sh, which builds and tags the images first:
#   IMAGE_TAG=<git sha> podman compose -f compose.prod.yaml up -d
services:
  db:
    image: docker.io/postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db_data:/var/lib/postgresql/18/docker
    # No `ports`: the database is reachable only on the internal network.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  migrate:
    image: nailpalace-migrator:${IMAGE_TAG:?}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  api:
    image: nailpalace-api:${IMAGE_TAG:?}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Asia/Jakarta
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      # Reverse proxy (HTTPS) on the host forwards to this loopback port.
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:
