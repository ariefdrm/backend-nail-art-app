name: backend-nail-art-app

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    init: true
    ports:
      - 3000:3000
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL_TEST: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
    restart: unless-stopped
    volumes:
      # :Z relabels for SELinux (Podman); with rootless Podman also run with --userns=keep-id
      - .:/app:Z
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_networks

  db:
    image: docker.io/postgres:18.6-alpine3.24
    container_name: db-nail-art-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/18/docker
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/db-init.sh:ro,Z
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_networks

  adminer:
    image: docker.io/adminer:latest
    profiles: ["tools"]
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_networks

networks:
  app_networks:
    driver: bridge

volumes:
  db_data:
