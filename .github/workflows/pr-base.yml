name: PR base

# `main` is the default branch and `develop` is the staging branch, so a PR
# opened without an explicit base lands on `main` by mistake. Only a release PR
# from `develop` of this repository may target `main`.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  check-source-branch:
    name: PR base
    runs-on: ubuntu-latest
    steps:
      - name: Only develop may be merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::error::PRs into main must come from the develop branch of $THIS_REPO (got '$HEAD_REF' from '$HEAD_REPO'). Retarget this PR to develop."
            exit 1
          fi
          echo "OK: develop -> main release PR"
